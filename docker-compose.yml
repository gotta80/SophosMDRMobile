services:
  sophos-mdr-mobile:
    build: .
    container_name: sophos-mdr-mobile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3456
    # BIND_IP: 127.0.0.1 (default) if a reverse proxy on the same host publishes the app over HTTPS;
    # or the server's LAN IP to reach it from the local network (HTTP, PIN-protected).
    ports:
      - "${BIND_IP:-127.0.0.1}:3456:3456"
